[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "koukou"
version = "0.1.0"
description = "摳摳 KouKou — local-first personal finance hub for Taiwan: e-invoice (and soon bank) data, organized by AI."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jacky Peng (pengwho)" }]
requires-python = ">=3.10"
dependencies = [
  "cryptography>=42",
  "curl_cffi>=0.7",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "keyring>=24",
]

[project.optional-dependencies]
browser = ["playwright>=1.45"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
koukou = "koukou.cli:main"

[project.urls]
Homepage = "https://github.com/pengwho/koukou"

[tool.setuptools.packages.find]
include = ["koukou*"]

[tool.setuptools.package-data]
"koukou.web" = ["static/*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
